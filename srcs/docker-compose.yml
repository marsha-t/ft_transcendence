# version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 5001:5001 
      - 5555:5555 # remove when submitting - this is used for prisma studio
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations   # bind mount migrations
      - db-data:/app/prisma/data # database is in a docker volume
      - ./backend/uploads:/app/uploads
    restart: always
  auth:
    build:
      context: ./backend/auth-service  # path to your auth microservice Dockerfile
      dockerfile: Dockerfile
    container_name: authservice
    ports:
      - 5002:5002
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
      - db-data:/app/prisma/data
      - ./backend/uploads:/app/uploads
    restart: always
  profile:
    build:
      context: ./backend/profile-service  # path to your auth microservice Dockerfile
      dockerfile: Dockerfile
    container_name: profileservice
    ports:
      - 5003:5003
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
      - db-data:/app/prisma/data
      - ./backend/uploads:/app/uploads
    restart: always
  friends:
    build:
      context: ./backend/friends-service  # path to your auth microservice Dockerfile
      dockerfile: Dockerfile
    container_name: friendsservice
    ports:
      - 5004:5004
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
      - db-data:/app/prisma/data
      - ./backend/uploads:/app/uploads
    restart: always
  dashboard:
    build:
      context: ./backend/dashboard-service  # path to your auth microservice Dockerfile
      dockerfile: Dockerfile
    container_name: dashboardservice
    ports:
      - 5005:5005
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
      - db-data:/app/prisma/data
      - ./backend/uploads:/app/uploads
    restart: always
  game_tournament:
    build:
      context: ./backend/game-tournament-service
      dockerfile: Dockerfile
    container_name: gametournamentservice
    ports:
      - 5006:5006
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
      - db-data:/app/prisma/data
    restart: always
  ai:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: aiservice
    ports:
      - "5007:5007"         # ← THIS LINE WAS MISSING OR WRONG!
    env_file:
      - ./.env
    environment:
      - PORT=5007           # ← add this too (very important!)
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
      - db-data:/app/prisma/data
      - ./backend/uploads:/app/uploads
    restart: always
  
  

  # backend-dev:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: backend-dev
  #   ports:
  #     - 5001:5001
  #     - 5555:5555
