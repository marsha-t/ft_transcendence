  #   command: sh -c "npx prisma migrate deploy && npm run dev"
  #   restart: always
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      # - 3000:3000
      - 443:443
    depends_on:
      - backend
    networks:
      - web
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    environment:
    - HOST=0.0.0.0
