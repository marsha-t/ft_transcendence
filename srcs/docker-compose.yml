# version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 5000:5000
    env_file:
      - ./backend/.env
    networks:
      - web
    volumes:
      - ./backend/prisma:/app/prisma
    restart: always

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dev
    ports:
      - 5000:5000
    env_file:
      - ./backend/.env
    networks:
      - web
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"
    restart: always
    profiles: ["dev"]
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - 3000:3000
    depends_on:
      - backend
    networks:
      - web
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
    - HOST=0.0.0.0

networks:
  web:
    name: transcendence
