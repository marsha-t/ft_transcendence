# version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 5000:5000
    env_file:
      - .env
    networks:
      - web
    # volumes:
    #   - ./srcs/backend/data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - 3000:3000
    depends_on:
      - backend
    networks:
      - web
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
    - HOST=0.0.0.0


networks:
  web:
    name: transcendence
