# version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 5001:5001 
      - 5555:5555 # remove when submitting - this is used for prisma studio
    env_file:
      - ./.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations   # bind mount migrations
      - db-data:/app/prisma/data # database is in a docker volume
      - ./backend/uploads:/app/uploads
    restart: always
  
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: elasticsearch
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - web
    restart: always
  
  kibana:
    image: kibana:8.17.0
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - web
    restart: always

  logstash:
    image: logstash:8.17.0
    container_name: logstash
    ports:
      - 5044:5044
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - web
    restart: always

  

  # backend-dev:
