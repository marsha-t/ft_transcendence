# version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - 5000:5000
    env_file:
      - ./backend/.env
    networks:
      - web
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations   # bind mount migrations
      - db-data:/app/prisma/data # database is in a docker volume
      - ./backend/uploads:/app/uploads
    restart: always

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-dev
    ports:
      - 5000:5000
      - 5555:5555
    env_file:
      - ./backend/.env
    networks:
      - web
    volumes:
      - ./backend:/app
      - /app/node_modules
      - db-data:/app/prisma/data
      - ./backend/uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run dev"
    restart: always
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - 3000:3000
    depends_on:
      - backend
    networks:
      - web
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
    - HOST=0.0.0.0

networks:
  web:
    name: transcendence

volumes:
  db-data:
  avatars-data:
