# Docker Compose File
# 5 Services, 2 Databases

services:
  # ===================================
  # USER-SOCIAL DATABASE SERVICES
  # All three share user-social.db
  # ===================================
  auth:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    expose:
      - "5001"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=file:/app/prisma/data/user-social.db
      - PORT=5001
    dns:
      - 8.8.8.8
    networks:
      - web
    volumes:
      - user-social-data:/app/prisma/data
      - ./backend/auth-service/prisma/migrations:/app/prisma/migrations
      - ./backend/auth-service/uploads:/app/uploads
    restart: always
  profile:
    build:
      context: ./backend/profile-service
      dockerfile: Dockerfile
    container_name: profile-service
    expose:
      - "5002"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=file:/app/prisma/data/user-social.db
      - PORT=5002
    networks:
      - web
    volumes:
      - user-social-data:/app/prisma/data  # Same volume as auth
      - ./backend/auth-service/uploads:/app/uploads
    depends_on:
      - auth
    restart: always
  friends:
    build:
      context: ./backend/friends-service
      dockerfile: Dockerfile
    container_name: friends-service
    expose:
      - "5003"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=file:/app/prisma/data/user-social.db
      - PORT=5003
    networks:
      - web
    volumes:
      - user-social-data:/app/prisma/data  # Same volume as auth
      - ./backend/auth-service/uploads:/app/uploads
    depends_on:
      - auth
    restart: always

  # ===================================
  # ANALYTICS SERVICE
  # Reads from both databases
  # ===================================
  dashboard:
    build:
      context: ./backend/dashboard-service
      dockerfile: Dockerfile
    container_name: dashboard-service
    expose:
      - "5004"
    env_file:
      - ./.env
    environment:
      - PORT=5004
      - AUTH_SERVICE_URL=http://auth:5001
      - GAME_SERVICE_URL=http://game-tournament:5005
    networks:
      - web
    volumes:
      # read-only access to both databases
      - user-social-data:/app/prisma/user-data:ro
      - game-tournament-data:/app/prisma/game-data:ro
    depends_on:
      - auth
      - game-tournament
    restart: always
  # ===================================
  # GAME-TOURNAMENT SERVICE
  # Has its own database
  # ===================================
  game-tournament:
    build:
      context: ./backend/game-tournament-service
      dockerfile: Dockerfile
    container_name: game-tournament-service
    expose:
      - "5005"
    env_file:
      - ./.env
    environment:
      - GAME_DB_URL=file:/app/prisma/data/game-tournament.db
      - PORT=5005
      - AUTH_SERVICE_URL=http://auth:5001
      - PROFILE_SERVICE_URL=http://profile:5002
    networks:
      - web
    volumes:
      - game-tournament-data:/app/prisma/data
      - ./backend/game-tournament-service/prisma/migrations:/app/prisma/migrations
    depends_on:
      - auth
      - profile
    restart: always

  # ===================================
  # FRONTEND
  # ===================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - 8080:443
    depends_on:
      - auth
      - profile
      - friends
      - dashboard
      - game-tournament
    networks:
      - web
    environment:
    - HOST=0.0.0.0
    restart: always
networks: 
  web:
    name: transcendence

volumes:
  # Shared by auth, profile, friends services
  user-social-data:
    name: user-social-data
  
  # Used only by game-tournament service
  game-tournament-data:
    name: game-tournament-data
