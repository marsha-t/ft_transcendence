<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcendence</title>
    <link rel="stylesheet" href="/styles/tailwind.css">

</head>
<body class="min-h-screen flex flex-col bg-color-yellow">
    <div id="app" class="flex flex-col flex-1">
        <header id="header-container"></header>
        <main id="content-container" class="flex-1 overflow-y-auto"></main>
        <footer id="footer-container"></footer>
    </div>
    <script type="module" src="js/main.js"></script>
    <script>
    document.body.addEventListener('click', (e) => {
        const target = e.target.closest('a');
        if(target && target.tagName === 'A' && target.href.startsWith(window.location.origin)){
            e.preventDefault();
            history.pushState(null, '', target.href);
            window.dispatchEvent(new PopStateEvent('popstate'));
        }
    });
</script>
</body>
</html>
