
server {
    # --------------------------------------------------
    # HTTPS SERVER CONFIGURATION
    # --------------------------------------------------
    # Nginx listens for HTTPS traffic.
    # Inside the container this is port 443.
    # On the host, this is mapped to port 8080.
    listen 443 ssl;
    server_name localhost;

    # --------------------------------------------------
    # SSL / TLS CONFIGURATION
    # --------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --------------------------------------------------
    # FRONTEND (STATIC FILES / SPA)
    # --------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to serve the requested file directly.
        # If it does not exist, fallback to index.html.
        try_files $uri /index.html;
    }

    # --------------------------------------------------
    # WEBSOCKET PROXY (REAL-TIME COMMUNICATION)
    # --------------------------------------------------
    location ^~ /ws/ {
        proxy_pass http://game-tournament:5005;
        
        # WebSocket-specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Ai 
    location ^~ /api/ai/ {
        proxy_pass http://game-tournament:5005;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

   # auth Service routes
    location ^~ /api/auth/ {
        proxy_pass http://auth:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Profile Service routes
    location /api/profileServ/ {
        proxy_pass http://profile:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Friends API requests to dedicated friends service
    location ^~ /api/friendsServ/ {
        proxy_pass http://friends:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Dashboard Service
    location ^~ /api/dashboardServ/ {
        proxy_pass http://dashboard:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Tournament and Game Service
    location ^~ /api/tournamentServ/ {
        proxy_pass http://game-tournament:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Tournament and Game Service
    location ^~ /api/gameSessionServ/ {
        proxy_pass http://game-tournament:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Tournament and Game Session Players Service
    location ^~ /api/gameSessionPlayersServ/ {
        proxy_pass http://game-tournament:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Uploads Proxy
    location /uploads/ {
        proxy_pass http://auth:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------
    # CACHING FOR STATIC ASSETS
    # --------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
